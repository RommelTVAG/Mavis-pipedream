# Mavis Pipedream credentials vault. Only Cloudflare (and localhost, for tests) may reach this site,
# so CF-Connecting-IP can be trusted for rate limiting. Refresh the ranges from
# https://www.cloudflare.com/ips-v4 and /ips-v6 if Cloudflare changes them.
server {
    listen 80;
    listen [::]:80;
    server_name pipedream-access.thevagroup.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pipedream-access.thevagroup.com;

    # Cloudflare Origin Certificate (wildcard *.thevagroup.com), same as the other sites
    ssl_certificate /etc/nginx/ssl/thevagroup.com.pem;
    ssl_certificate_key /etc/nginx/ssl/thevagroup.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # allow <each range from https://www.cloudflare.com/ips-v4 and /ips-v6>;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 4k;

    # The caller address the app rate-limits on: set by Cloudflare, never by the caller.
    set $client_ip $http_cf_connecting_ip;
    if ($client_ip = "") { set $client_ip $remote_addr; }

    location = /api/credentials {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:4021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:4021;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / { return 404; }
}
